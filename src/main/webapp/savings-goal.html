<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Savings Goal</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="form-card">

    <h1>Set Savings Goal</h1>

    <form action="savings-goal" method="post">

        <label for="goalName">Goal Name</label>

        <input type="text"
               id="goalName"
               name="goalName"
               placeholder="e.g. New Laptop"
               required>

        <label for="targetAmount">Target Amount</label>

        <input type="number"
               id="targetAmount"
               name="targetAmount"
               step="0.01"
               min="0"
               placeholder="Enter target amount"
               required>

        <label for="currentAmount">Current Savings</label>

        <input type="number"
               id="currentAmount"
               name="currentAmount"
               step="0.01"
               min="0"
               placeholder="Enter current savings"
               required>

        <button type="submit">
            Save Savings Goal
        </button>

    </form>

    <a href="dashboard" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>

</html>
